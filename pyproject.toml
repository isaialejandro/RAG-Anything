[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raganything"
dynamic = ["version"]
authors = [
    {name = "Zirui Guo"}
]
description = "RAGAnything: All-in-One RAG System"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "huggingface_hub",
    "lightrag-hku<1.5",
    # <4: MinerU 4.0 replaced the CLI RAG-Anything drives (`mineru -p ... -o ...`)
    # with subcommands and Markdown-only output, so 4.x is not supported yet.
    # python_version < "3.14": every MinerU 3.x release requires Python <3.14.
    # Without the marker, pip on 3.14 skips this release and falls back to
    # raganything 1.4.3 with MinerU 4.x; with it, 3.14 gets this release
    # without MinerU (use the Docling parser there).
    'mineru[core]>=3.4.1,<4; python_version < "3.14"',
    "tqdm",
]

[project.optional-dependencies]
image = ["Pillow>=10.0.0"]
text = ["reportlab>=4.0.0"]
office = []  # Requires LibreOffice (external program)
# MinerU is unavailable on Python 3.14, so Docling is the only parser there,
# yet nothing declared how to install it. These markers close that gap.
# docling-slim exposes the same DocumentConverter/PdfFormatOption API that
# raganything/parser.py imports; the full distribution adds docling-ibm-models
# (TableFormer layout models), which pulls torch. PyTorch ships no macOS
# x86_64 wheel after 2.2.2 and none at all for cp314 on that platform, so an
# Intel Mac can only resolve the slim build.
docling = [
    "docling-slim>=2.150.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "docling>=2.0.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "docling>=2.0.0; sys_platform != 'darwin'",
]
# paddlepaddle, which paddleocr requires, publishes no cp314 wheel.
paddleocr = [
    "paddleocr>=2.7.0; python_version < '3.14'",
    "pypdfium2>=4.25.0",
]
markdown = [
    "markdown>=3.4.0",
    "weasyprint>=60.0",
    "pygments>=2.10.0",
]
# av<19: faster-whisper 1.2.1 calls av.open(..., metadata_errors=...), which
# PyAV 19 removed, so every transcription fails. Drop once a fixed release ships.
audio = ["faster-whisper>=1.0.0", "av<19"]
video = [
    "scenedetect[opencv]>=0.6.0",
    "moviepy>=2.0.0",
    "faster-whisper>=1.0.0",
    "av<19",  # see audio
    "opencv-python>=4.8.0",
]
all = [
    "Pillow>=10.0.0",
    "reportlab>=4.0.0",
    "paddleocr>=2.7.0; python_version < '3.14'",  # paddlepaddle has no cp314 wheel
    "pypdfium2>=4.25.0",
    "markdown>=3.4.0",
    "weasyprint>=60.0",
    "pygments>=2.10.0",
    "faster-whisper>=1.0.0",
    "av<19",  # see audio
    "scenedetect[opencv]>=0.6.0",
    "moviepy>=2.0.0",
    "opencv-python>=4.8.0",
    # Without these, `[all]` on Python 3.14 leaves no usable parser at all,
    # because the MinerU dependency is skipped there. See the `docling` extra.
    "docling-slim>=2.150.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "docling>=2.0.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "docling>=2.0.0; sys_platform != 'darwin'",
]

[project.urls]
Homepage = "https://github.com/HKUDS/RAG-Anything"
Documentation = "https://github.com/HKUDS/RAG-Anything"
Repository = "https://github.com/HKUDS/RAG-Anything"
Issues = "https://github.com/HKUDS/RAG-Anything/issues"

[tool.uv]
dev-dependencies = [
    "pytest>=6.0",
    "pytest-asyncio",
    "black",
    "isort",
    "flake8",
    "mypy",
    "openai",
    "python-dotenv",
]

[tool.setuptools.packages.find]
include = ["raganything*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "raganything.__version__"}

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
norecursedirs = ["examples"]
